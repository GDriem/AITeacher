      tags:
      - Assessments
      description: 'Authenticated. Owner only. Omitted questions count as unanswered.
        Unknown/duplicate questions or options and invalid cardinality return 400
        without writes. Expired attempts return 409. Answers are normalized by fixed
        question order and sorted options: identical replay returns the persisted
        result; changed answers return 409. Closed-only submissions commit scores
        and evidence atomically. Rubric and mixed submissions stay pendingReview without
        feedback or evidence until a complete immutable human review commits scores
        and evidence. Each question weighs equally; selecting all multiple-choice
        options scores zero. No keys in responses. Never feedback hides aggregate
        and per-question scores. Cache-Control: no-store.'
