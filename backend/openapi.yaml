              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: updateSubjects
      summary: Update a subjects entry
      description: Author only. Replaces name, slug, order and availability. Parent
        references and scale purpose are immutable. Supply the last read version;
        concurrent or stale saves return 409. No physical delete in this milestone.
      tags:
      - Catalog
      parameters:
