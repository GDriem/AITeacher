openapi: 3.0.3
info:
  title: AITeacher backend
  version: 0.5.0
  description: Milestone 4. PostgreSQL identity, catalog, editorial revisions, closed
    assessments, private tutor conversations and notes with bounded contexts.
    Independent host; does not replace Python or migrate production data.
    Errors use ProblemDetails.
servers:
- url: http://localhost:5080
  description: Local development
tags:
- name: Health
  description: Host and database health
- name: Identity
  description: Google authentication and database sessions
- name: Catalog
  description: Authenticated reads; author-only writes
- name: Assessments
  description: Immutable closed questions and definitions; student-owned attempts.
- name: Editorial
  description: Author-only editorial snapshots; authenticated students read active
    publications.
- name: Tutor
  description: Private tutor, verified editorial sources and notes; providers by capability.
security:
- sessionCookie: []
paths:
  /api/catalog/subjects:
    get:
      operationId: listSubjects
      summary: List subjects
      description: Authenticated shared editorial catalog, including unavailable entries.
        Stable sort by sortOrder and id. Parent references are returned for client
        grouping.
      tags:
      - Catalog
      parameters:
      - &id003
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id004
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid pagination
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createSubjects
      summary: Create subjects
      description: Author only. Slugs are unique globally for subjects/scales, within
        subject for categories, within scale for levels and within category for topics.
        Creates are not idempotent; a duplicate slug returns 409. Topics must reference
        a category of the same subject.
      tags:
      - Catalog
      parameters:
      - &id001
        name: X-CSRF-TOKEN
        in: header
        required: true
        description: Fetch /api/auth/csrf, retain its cookie and send requestToken
          here. Fetch again after login or changing identity.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '201':
          description: Created catalog entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
          headers:
            Location:
              description: New entry URL
              schema:
                type: string
        '400':
          description: Invalid input, parent or CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Author permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Duplicate slug in this scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/catalog/subjects/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: getSubjects
      summary: Read a subjects entry
      tags:
      - Catalog
      responses:
        '200':
          description: Catalog entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Entry not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: updateSubjects
      summary: Update a subjects entry
      description: Author only. Replaces name, slug, order and availability. Parent
        references and scale purpose are immutable. Supply the last read version;
        concurrent or stale saves return 409. No physical delete in this milestone.
      tags:
      - Catalog
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntryRequest'
      responses:
        '200':
          description: Saved entry with incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '400':
          description: Invalid input or CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
