components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ait_dotnet_session
  schemas:
    ProblemDetails:
      type: object
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    EntryRequest:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          pattern: .*\S.*
          example: Matemáticas
        slug:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          example: matematicas
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        isAvailable:
          type: boolean
          default: true
    EntryResponse:
      type: object
      required:
      - id
      - name
      - slug
      - sortOrder
      - isAvailable
      - version
      properties:
        id: *id002
        name:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        isAvailable:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        subjectId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        scaleId:
          type: string
          format: uuid
          nullable: true
        levelId:
          type: string
          format: uuid
          nullable: true
        purpose:
          type: string
          nullable: true
          enum:
          - difficulty
          - proficiency
          - mastery
          - null
    UpdateEntryRequest:
      type: object
      required:
      - version
      - entry
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        entry:
          $ref: '#/components/schemas/EntryRequest'
    CategoryRequest:
      type: object
      required:
      - subjectId
      - entry
      properties:
        subjectId: *id002
        entry:
          $ref: '#/components/schemas/EntryRequest'
    ScaleRequest:
      type: object
      required:
      - purpose
      - entry
      properties:
        purpose:
          type: string
          enum:
          - difficulty
          - proficiency
          - mastery
        entry:
          $ref: '#/components/schemas/EntryRequest'
    LevelRequest:
      type: object
      required:
      - scaleId
      - entry
      properties:
        scaleId: *id002
        entry:
          $ref: '#/components/schemas/EntryRequest'
    TopicRequest:
      type: object
      required:
      - subjectId
      - categoryId
      - entry
      properties:
        subjectId: *id002
        categoryId: *id002
        levelId:
          type: string
          format: uuid
          nullable: true
        entry:
          $ref: '#/components/schemas/EntryRequest'
    AuthenticationStatus:
      type: object
      required: [enabled, authenticated, googleClientId, profile]
      properties:
        enabled:
          type: boolean
          enum: [true]
        authenticated:
          type: boolean
        googleClientId:
          type: string
          nullable: true
        profile:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/StudentProfile'
    StudentProfile:
      type: object
      required:
      - studentId
      - email
      - displayName
      - canAuthor
      properties:
        studentId:
          type: string
          description: Same google- plus 32 lowercase SHA-256 hex characters used
            by Python.
        email:
          type: string
        displayName:
          type: string
        canAuthor:
          type: boolean
    CatalogPage:
      type: object
      required:
      - items
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryResponse'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    GoogleLoginRequest:
      type: object
      required:
      - credential
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 8192
          description: Google GIS ID token, never an access token.
    CsrfToken:
      type: object
      required:
      - requestToken
      properties:
        requestToken:
          type: string
    UnitConcept:
      type: object
      required:
      - id
      - name
      properties:
        id: *id005
        name:
          type: string
          minLength: 1
          maxLength: 150
    UnitObjective:
      type: object
      required:
      - id
      - description
      - conceptIds
      properties:
        id: *id005
        description:
          type: string
          minLength: 1
          maxLength: 2000
        conceptIds:
          type: array
          maxItems: 200
          items: *id005
    UnitReading:
      type: object
      required:
      - id
      - title
      - text
      - source
      - objectiveIds
      properties:
        id: *id005
        title:
          type: string
          minLength: 1
          maxLength: 150
        text:
          type: string
          minLength: 1
          maxLength: 100000
        source:
          type: string
          minLength: 1
          maxLength: 1000
        objectiveIds:
          type: array
          maxItems: 200
          items: *id005
    UnitExercise:
      type: object
      required:
      - id
      - prompt
      - objectiveIds
      properties:
        id: *id005
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        objectiveIds:
          type: array
          maxItems: 200
          items: *id005
    UnitAssessment:
      type: object
      required:
      - id
      - prompt
      - privateCriteria
      - objectiveIds
      properties:
        id: *id005
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        privateCriteria:
          type: string
          minLength: 1
          maxLength: 20000
        objectiveIds:
          type: array
          maxItems: 200
          items: *id005
    UnitPrerequisite:
      type: object
      required:
      - conceptId
      - requiresConceptId
      properties:
        conceptId: *id005
        requiresConceptId: *id005
    ReadingProvenance:
      type: object
      required: [sourceId, topic, level, keywords]
      properties:
        sourceId:
          type: string
        topic:
          type: string
        level:
          type: string
        keywords:
          type: array
          items:
            type: string
    SourceCurriculumView:
      type: object
      required: [source, topics, levels]
      properties:
        source:
          type: string
        topics:
          type: array
          items:
            type: object
            required: [slug, name, subject, category, prerequisites]
            properties:
              slug:
                type: string
              name:
                type: string
              subject:
                type: string
              category:
                type: string
              prerequisites:
                type: array
                items:
                  type: string
        levels:
          type: array
          items:
            type: object
            required: [slug, name]
            properties:
              slug:
                type: string
              name:
                type: string
    UnitDocument:
      type: object
      required:
      - title
      - concepts
      - objectives
      - readings
      - exercises
      - assessments
      - prerequisites
      properties:
        kind:
          type: string
          enum: [learningUnit, reading]
          default: learningUnit
          description: Reading material cannot claim objectives, concepts, exercises or assessments. Complete learning units retain coverage requirements.
        readingProvenance:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ReadingProvenance'
        title: &id011
          type: string
          minLength: 1
          maxLength: 150
        concepts: &id012
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitConcept'
        objectives: &id013
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitObjective'
        readings: &id014
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitReading'
        exercises: &id015
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitExercise'
        assessments:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitAssessment'
        prerequisites: &id016
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnitPrerequisite'
    StudentUnitDocument:
      type: object
      required:
      - title
      - concepts
      - objectives
      - readings
      - exercises
      - prerequisites
      properties:
        kind:
          type: string
          enum: [learningUnit, reading]
          default: learningUnit
          description: Reading material cannot claim objectives, concepts, exercises or assessments. Complete learning units retain coverage requirements.
        readingProvenance:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ReadingProvenance'
        title: *id011
        concepts: *id012
        objectives: *id013
        readings: *id014
        exercises: *id015
        prerequisites: *id016
      additionalProperties: false
    UnitVersionRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
    CreateUnitRequest:
      type: object
      required:
      - topicId
      - document
      properties:
        topicId: *id005
        document:
          $ref: '#/components/schemas/UnitDocument'
    CreateRevisionRequest:
      type: object
      required:
      - version
      - document
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        document:
          $ref: '#/components/schemas/UnitDocument'
    UnitRevision:
      type: object
      required:
      - id
      - number
      - createdAt
      - createdBy
      - origin
      - document
      properties:
        id: *id005
        number:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        origin:
          type: object
          nullable: true
          additionalProperties: true
        document:
          oneOf:
          - $ref: '#/components/schemas/UnitDocument'
          - $ref: '#/components/schemas/StudentUnitDocument'
    UnitResponse:
      type: object
      required:
      - id
      - topicId
      - version
      - publishedRevisionId
      - revision
      properties:
        id: *id005
        topicId: *id005
        version:
          type: integer
          format: int64
        publishedRevisionId:
          type: string
          format: uuid
          nullable: true
        revision:
          $ref: '#/components/schemas/UnitRevision'
    UnitSummary:
      type: object
      required:
      - id
      - topicId
      - version
      - publishedRevisionId
      - revisionId
      - number
      - title
      properties:
        kind:
          type: string
          enum: [learningUnit, reading]
        readingProvenance:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ReadingProvenance'
        id: *id005
        topicId: *id005
        version:
          type: integer
          format: int64
        publishedRevisionId:
          type: string
          format: uuid
          nullable: true
        revisionId: *id005
        number:
          type: integer
        title:
          type: string
    UnitPage:
      type: object
      required:
      - items
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnitSummary'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    UnitRevisionSummary:
      type: object
      required:
      - id
      - number
      - createdAt
      - createdBy
      - publishedAt
      properties:
        id: *id005
        number:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
    UnitRevisionPage:
      type: object
      required:
      - items
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnitRevisionSummary'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    CorpusRecord:
      type: object
      required:
      - id
      - topic
      - title
      - level
      - text
      - source
      - keywords
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 150
        topic:
          type: string
          minLength: 1
          maxLength: 150
        title:
          type: string
          minLength: 1
          maxLength: 150
        level:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          minLength: 1
          maxLength: 100000
        source:
          type: string
          minLength: 1
          maxLength: 1000
        keywords:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 150
    ImportCorpusRequest:
      type: object
      required:
      - records
      - topicMappings
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CorpusRecord'
        topicMappings:
          type: object
          additionalProperties: *id005
    ImportCorpusResponse:
      type: object
      required:
      - created
      - skipped
      - items
      properties:
        created:
          type: integer
        skipped:
          type: integer
        items:
          type: array
          items:
            type: object
            required:
            - sourceId
            - unitId
            properties:
              sourceId:
                type: string
              unitId: *id005
    AssessmentOption:
      type: object
      required:
      - id
      - text
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
      additionalProperties: false
    ClosedQuestionDocument:
      type: object
      required:
      - unitId
      - unitRevisionId
      - objectiveIds
      - conceptIds
      - type
      - prompt
      - options
      - scoringPolicy
      - correctOptionIds
      properties:
        unitId:
          type: string
          format: uuid
        unitRevisionId:
          type: string
          format: uuid
        objectiveIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        conceptIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        type:
          type: string
          enum:
          - singleChoice
          - multipleChoice
          - trueFalse
          - openResponse
          - caseAnalysis
          - practicalExercise
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        options:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentOption'
          minItems: 0
          maxItems: 50
        scoringPolicy:
          type: string
          enum:
          - exactMatch
          - partialCredit
          - rubric
        correctOptionIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        rubric:
          $ref: '#/components/schemas/AssessmentRubric'
          nullable: true
      additionalProperties: false
      description: Closed types require options/key and forbid rubric. Advanced types
        require empty options/key, scoringPolicy rubric and a versioned private rubric.
    AssessmentDefinitionDocument:
      type: object
      required:
      - title
      - unitId
      - unitRevisionId
      - objectiveIds
      - questionRevisionIds
      - mode
      - timeLimitMinutes
      - maxAttempts
      - feedback
      - assistance
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        unitId:
          type: string
          format: uuid
        unitRevisionId:
          type: string
          format: uuid
        objectiveIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        questionRevisionIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 100
