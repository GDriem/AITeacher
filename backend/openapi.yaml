              $ref: '#/components/schemas/UpdateEntryRequest'
      responses:
        '200':
          description: Saved entry with incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '400':
          description: Invalid input or CSRF token
