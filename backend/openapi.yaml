            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Obtain /api/auth/csrf after login and retain cookies.
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
