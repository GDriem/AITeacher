openapi: 3.0.3
info:
  title: AITeacher backend
  version: 0.8.0
  description: 'Milestone 5. PostgreSQL identity, catalog, editorial revisions, closed
    assessments, private tutor conversations and notes with bounded contexts. Versioned
    editorial graphs, private observations and correction history. Independent host;
    does not replace Python or migrate production data. Errors use ProblemDetails.
    Milestone 6 increment: human rubric reviews, durable evidence consumption and
    explicit delayed reviews. Mastery remains uncalibrated. Milestone 7 increment:
    private read-only Python history; local migration rehearsal only.'
servers:
- url: http://localhost:5080
  description: Local development
tags:
- name: Health
  description: Host and database health
- name: Identity
  description: Google authentication and database sessions
- name: Catalog
  description: Authenticated reads; author-only writes
- name: Assessments
  description: Immutable closed and rubric questions; student-owned attempts and author
    reviews.
- name: Editorial
  description: Author-only editorial snapshots; authenticated students read active
    publications.
- name: Tutor
  description: Private tutor, verified editorial sources and notes; providers by capability.
- name: Graphs
  description: Versioned editorial references and student-owned conversation maps.
- name: Learning
  description: Private evidence and explicit delayed reviews; no calibrated mastery
    policy.
- name: History
  description: Private read-only imported Python history; no calibrated mastery or
    executable pending quizzes.
security:
- sessionCookie: []
paths:
  /api/tutor/voice:
    get:
      operationId: getVoiceAvailability
      summary: Read whether authenticated live voice is configured
      tags: [Tutor]
      responses:
        '200':
          description: Server-selected availability; no credentials or model overrides
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '401': {description: Session required}
  /api/tutor/conversations/{id}/voice:
    get:
      operationId: connectLiveVoice
      summary: Upgrade an owned active conversation to live voice
      description: Same-origin WebSocket only, with the authenticated API cookie. Session and active publication are verified before a provider connection. One connection per student across replicas via a dedicated PostgreSQL session lock, released on disconnect or failure. Ten-minute maximum; provider setup times out after 20 seconds. Client binary frames are mono PCM16 at 16kHz, maximum 32768 bytes. JSON commands are text (maximum 4000 characters) or stop_audio. Server emits ready (sample_rate 24000), transcript (user or tutor), interrupted and turn_complete; binary frames are PCM16 at 24kHz. Credentials remain on the server. Audio and transcripts are not persisted or treated as evidence. Reconnection obtains a new provider session with the authorized unit/activity context; ephemeral voice dialogue is not automatically restored.
      tags: [Tutor]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '101': {description: WebSocket upgrade succeeded}
        '400': {description: WebSocket upgrade required}
        '401': {description: Session required}
        '403': {description: Same-origin Origin required}
        '404': {description: Conversation absent or belongs to another student}
        '409': {description: Conversation publication changed or withdrawn}
        '429': {description: Student already connected or global voice capacity reached}
        '503': {description: 'Voice disabled, misconfigured or provider unavailable'}
  /api/auth/status:
    get:
      operationId: getAuthenticationStatus
      summary: Read public Google configuration and current session
      description: Always requires login for private operations. Returns the public OAuth client ID and a profile only for the current authenticated session. Response uses Cache-Control no-store. No credentials, subjects or author allowlists are exposed.
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Public configuration and optional own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationStatus'
  /api/catalog/subjects:
    get:
      operationId: listSubjects
      summary: List subjects
      description: Authenticated shared editorial catalog, including unavailable entries.
        Stable sort by sortOrder and id. Parent references are returned for client
        grouping.
      tags:
      - Catalog
      parameters:
      - &id003
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id004
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid pagination
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createSubjects
      summary: Create subjects
      description: Author only. Slugs are unique globally for subjects/scales, within
        subject for categories, within scale for levels and within category for topics.
        Creates are not idempotent; a duplicate slug returns 409. Topics must reference
        a category of the same subject.
      tags:
      - Catalog
      parameters:
      - &id001
        name: X-CSRF-TOKEN
        in: header
        required: true
        description: Fetch /api/auth/csrf, retain its cookie and send requestToken
          here. Fetch again after login or changing identity.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '201':
          description: Created catalog entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
          headers:
            Location:
              description: New entry URL
              schema:
                type: string
        '400':
          description: Invalid input, parent or CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Author permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Duplicate slug in this scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/catalog/subjects/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: getSubjects
      summary: Read a subjects entry
      tags:
      - Catalog
      responses:
        '200':
          description: Catalog entry
          content:
            application/json:
              schema:
