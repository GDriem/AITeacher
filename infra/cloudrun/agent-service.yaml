apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: learning-agent
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: learning-agent@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/agent-mcp-run/agent-app:TAG
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PROVIDER
              value: gemini
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: us
            - name: GOOGLE_CLOUD_LIVE_LOCATION
              value: us-central1
            - name: GEMINI_MODEL
              value: gemini-3.5-flash-lite
            - name: APP_SESSIONS_BACKEND
              value: firestore
            - name: FIRESTORE_SESSIONS_COLLECTION
              value: learning_sessions
            - name: APP_SESSION_RETENTION_DAYS
              value: "365"
            - name: APP_STUDENT_PROFILES_BACKEND
              value: firestore
            - name: FIRESTORE_STUDENT_PROFILES_COLLECTION
              value: student_profiles
            - name: GOOGLE_CLIENT_ID
              value: GOOGLE_OAUTH_WEB_CLIENT_ID
            - name: APP_AUTH_COOKIE_SECURE
              value: "true"
            - name: APP_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: learning-agent-session-secret
                  key: latest
            - name: GEMINI_LIVE_MODEL
              value: gemini-live-2.5-flash-native-audio
            - name: GEMINI_LIVE_VOICE
              value: Kore
            - name: MCP_USE_LOCAL_ADAPTER
              value: "false"
            - name: MCP_SERVER_URL
              value: MCP_SERVICE_URL/mcp/
            - name: MCP_AUTH_AUDIENCE
              value: MCP_SERVICE_URL
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
