$kind: http-request
description: Authenticated shared editorial catalog, including unavailable entries.
  Stable sort by sortOrder and id. Parent references are returned for client grouping.
url: '{{baseUrl}}/api/catalog/topics?offset=0&limit=50'
method: GET
headers:
- key: Accept
  value: application/json
queryParams:
  offset: '0'
  limit: '50'
settings: {}
order: 1000
auth:
  type: noauth
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('Expected success', () => pm.expect(pm.response.code).to.be.oneOf([200,
    201, 204]));
