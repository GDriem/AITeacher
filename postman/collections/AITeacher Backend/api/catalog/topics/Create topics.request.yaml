$kind: http-request
description: Author only. Slugs are unique globally for subjects/scales, within subject
  for categories, within scale for levels and within category for topics. Creates
  are not idempotent; a duplicate slug returns 409. Topics must reference a category
  of the same subject.
url: '{{baseUrl}}/api/catalog/topics'
method: POST
headers:
- key: X-CSRF-TOKEN
  value: '{{csrfToken}}'
  disabled: false
  description: (Required) Fetch /api/auth/csrf, retain its cookie and send requestToken
    here. Fetch again after login or changing identity.
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |
    {
      "subjectId": "89982aea-7602-08b5-5adf-bf84e9454796",
      "categoryId": "a4812588-8b06-f5b5-867f-ea175ddd82ab",
      "entry": {
        "name": "Matemáticas",
        "slug": "matematicas",
        "sortOrder": 0,
        "isAvailable": true
      },
      "levelId": "5a2a2019-2d56-384a-a209-ad2ba16e799b"
    }
settings: {}
order: 2000
auth:
  type: noauth
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('Expected success', () => pm.expect(pm.response.code).to.be.oneOf([200,
    201, 204]));
