$kind: http-request
method: GET
url: '{{baseUrl}}/api/tutor/conversations/{{conversationId}}/messages?offset=0&limit=50'
order: 5000
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test("Messages page",()=>{pm.response.to.have.status(200);pm.expect(pm.response.headers.get("Cache-Control")).to.eql("no-store");});
