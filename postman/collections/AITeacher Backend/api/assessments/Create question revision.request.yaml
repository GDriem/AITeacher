$kind: http-request
method: POST
url: '{{baseUrl}}/api/assessments/questions'
order: 1000
headers:
- key: Content-Type
  value: application/json
- key: X-CSRF-TOKEN
  value: '{{csrfToken}}'
body:
  type: json
  content: "{\n  \"id\": \"{{questionId}}\",\n  \"number\": 1,\n  \"document\": {\n\
    \    \"unitId\": \"{{unitId}}\",\n    \"unitRevisionId\": \"{{revisionId}}\",\n\
    \    \"objectiveIds\": [\n      \"10000000-0000-0000-0000-000000000002\"\n   \
    \ ],\n    \"conceptIds\": [\n      \"10000000-0000-0000-0000-000000000001\"\n\
    \    ],\n    \"type\": \"singleChoice\",\n    \"prompt\": \"¿Qué conserva el historial\
    \ completo?\",\n    \"options\": [\n      {\n        \"id\": \"20000000-0000-0000-0000-000000000001\"\
    ,\n        \"text\": \"Persistencia\"\n      },\n      {\n        \"id\": \"20000000-0000-0000-0000-000000000002\"\
    ,\n        \"text\": \"Contexto\"\n      }\n    ],\n    \"correctOptionIds\":\
    \ [\n      \"20000000-0000-0000-0000-000000000001\"\n    ],\n    \"scoringPolicy\"\
    : \"exactMatch\"\n  }\n}"
scripts:
- type: beforeRequest
  language: text/javascript
  code: pm.collectionVariables.set("questionId",pm.variables.replaceIn("{{$guid}}"));
- type: afterResponse
  language: text/javascript
  code: pm.test("Expected 201",()=>pm.response.to.have.status(201)); if(pm.response.code
    < 300){ const q=pm.response.json(); pm.collectionVariables.set("questionRevisionId",q.id);
    }
