$kind: http-request
method: GET
url: '{{baseUrl}}/api/assessments/definitions'
order: 6000
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test("Expected 200",()=>pm.response.to.have.status(200)); if(pm.response.code
    < 300){ pm.test("Public metadata has no answer keys",()=>pm.expect(pm.response.text()).not.to.include("correctOptionIds"));
    }
