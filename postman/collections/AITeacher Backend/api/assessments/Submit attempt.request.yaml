$kind: http-request
method: POST
url: '{{baseUrl}}/api/assessments/attempts/{{attemptId}}/submit'
order: 9000
headers:
- key: Content-Type
  value: application/json
- key: X-CSRF-TOKEN
  value: '{{csrfToken}}'
body:
  type: json
  content: "{\n  \"answers\": [\n    {\n      \"questionRevisionId\": \"{{questionRevisionId}}\"\
    ,\n      \"selectedOptionIds\": [\n        \"20000000-0000-0000-0000-000000000001\"\
    \n      ]\n    }\n  ]\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test("Expected 200",()=>pm.response.to.have.status(200)); if(pm.response.code
    < 300){ pm.test("Submitted and full score",()=>{pm.expect(pm.response.json().status).to.eql("submitted");pm.expect(pm.response.json().fraction).to.eql(1);});
    }
