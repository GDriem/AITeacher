name: CD Azure beta

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push CI run ID for the current main commit
        required: true
        type: string
      operation:
        description: deploy publishes; verify-access only checks OIDC and read access
        required: true
        default: deploy
        type: choice
        options: [deploy, verify-access]

permissions: {}

jobs:
  validate:
    if: >-
      github.repository == 'GDriem/AITeacher' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exact commit and all four CI jobs
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 backend/scripts/beta_ci_guard.py

  verify-access:
    needs: validate
    # Read-only: proves federation, subscription visibility and reads before enabling CD.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-access'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: beta
    concurrency:
      group: aiteacher-azure-beta
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
      CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Revalidate after the lock and environment rules
        run: python3 backend/scripts/beta_ci_guard.py
      - name: Check environment configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$CLIENT_ID"
          test "$TENANT_ID" = '82090019-87c1-4439-918c-a31932facc9a'
          test "$SUBSCRIPTION_ID" = '1350d930-7008-4b43-923d-6a7cd66701bc'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Exchange an ACR token with the federated session
        run: az acr login --name craiteacherbeta8136
      - name: Read-only preflight of app, revision and both jobs
        run: python3 backend/scripts/update-azure-beta.py --verify-access
      - name: Clear local registry session
        if: always()
        run: docker logout craiteacherbeta8136.azurecr.io

  deploy:
    needs: validate
    # Repository switch stays false until the owner approves Azure RBAC and first deployment.
    if: >-
      vars.BETA_CD_ENABLED == 'true' &&
      (github.event_name == 'workflow_run' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: beta
      url: https://ca-aiteacher-beta-8136.thankfuldune-75a4eb8a.mexicocentral.azurecontainerapps.io
    concurrency:
      group: aiteacher-azure-beta
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
      CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Revalidate after the deployment lock and environment rules
        run: python3 backend/scripts/beta_ci_guard.py
      - name: Check environment configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$CLIENT_ID"
          test "$TENANT_ID" = '82090019-87c1-4439-918c-a31932facc9a'
          test "$SUBSCRIPTION_ID" = '1350d930-7008-4b43-923d-6a7cd66701bc'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to existing ACR with the federated session
        run: az acr login --name craiteacherbeta8136
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish the validated source
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile.azure
          platforms: linux/amd64
          push: true
          # Single-platform manifest like the existing az acr build images; no attestation index.
          provenance: false
          sbom: false
          tags: craiteacherbeta8136.azurecr.io/aiteacher:git-${{ needs.validate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install existing functional check tooling
        run: npm install -g postman-cli@1.75.0
      - name: Migrate, grant runtime SQL access, update by digest and verify
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 backend/scripts/update-azure-beta.py
      - name: Clear local registry session
        if: always()
        run: docker logout craiteacherbeta8136.azurecr.io
