name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secretos y workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar herramientas verificadas
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          curl --fail --silent --show-error --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Revisar secretos en el historial
        run: /tmp/gitleaks git --log-opts=--all --redact --no-banner
      - name: Validar GitHub Actions
        run: /tmp/actionlint -shellcheck=''

  python:
    name: Python y scripts
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev,agents,cloud,foundry]"
      - name: Suite Python completa
        run: python -m pytest
      - name: Validar sintaxis Bash
        run: bash -n infra/cloudrun/deploy.sh infra/cloudrun/smoke-test.sh backend/scripts/deploy-azure.sh backend/scripts/verify-azure.sh .claude/skills/gcp-readiness/dispatch-codex.sh
      - name: Validar whitespace del diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

  frontend:
    name: Frontend
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Habilitar pnpm
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Budget
        run: pnpm budget:check
      - name: Contrato y build de la beta .NET
        run: |
          pnpm api:backend:check
          pnpm build:backend
          pnpm budget:check

  backend:
    name: Backend PostgreSQL, contratos y recorrido React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiteacher
          POSTGRES_PASSWORD: aiteacher-ci-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U aiteacher"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AITEACHER_TEST_POSTGRES: Host=127.0.0.1;Port=55432;Database=postgres;Username=aiteacher;Password=aiteacher-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Postman CLI
        run: npm install -g postman-cli@1.75.0
      - name: Preparar navegador
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verificar backend y recorrido completo con datos sintéticos
        run: python backend/scripts/run-local-checks.py
